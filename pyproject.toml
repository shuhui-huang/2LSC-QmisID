[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qmisid"
version = "0.1.0"
description = "Columnar Python framework for electron charge-flip (QmisID) background estimation"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "awkward>=2.0",
    "uproot>=5.0",
    "iminuit>=2.17",
    "pyyaml",
    "matplotlib>=3.5",
    "mplhep",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
qmisid = "qmisid.cli:main"

[tool.setuptools]
packages = ["qmisid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
